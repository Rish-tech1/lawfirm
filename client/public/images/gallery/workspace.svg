<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice">
  <rect width="800" height="600" fill="#eae6dc"/>
  <rect y="0" width="800" height="300" fill="#e0dbd0"/>
  <!-- Pendant lights -->
  <g stroke="#8f7335" stroke-width="3">
    <path d="M200 0v90M400 0v70M600 0v90"/>
  </g>
  <g fill="#111111">
    <path d="M172 90h56l14 34h-84z"/>
    <path d="M372 70h56l14 34h-84z"/>
    <path d="M572 90h56l14 34h-84z"/>
  </g>
  <!-- Two facing desk rows -->
  <rect x="70" y="300" width="300" height="20" fill="#5a4c37"/>
  <rect x="430" y="300" width="300" height="20" fill="#5a4c37"/>
  <rect x="90" y="320" width="260" height="130" fill="#3d3427"/>
  <rect x="450" y="320" width="260" height="130" fill="#3d3427"/>
  <!-- Monitors -->
  <g fill="#1c2226">
    <rect x="140" y="216" width="120" height="76" rx="4"/>
    <rect x="500" y="216" width="120" height="76" rx="4"/>
  </g>
  <g fill="#31302c"><rect x="192" y="292" width="16" height="10"/><rect x="552" y="292" width="16" height="10"/></g>
  <!-- Document compilations on each desk -->
  <g fill="#f4f2ed">
    <rect x="270" y="284" width="70" height="16"/><rect x="274" y="272" width="62" height="12"/>
    <rect x="460" y="284" width="70" height="16"/><rect x="464" y="272" width="62" height="12"/>
  </g>
  <!-- Task chairs -->
  <g fill="#2f2e2a">
    <rect x="170" y="470" width="110" height="60" rx="10"/>
    <rect x="520" y="470" width="110" height="60" rx="10"/>
  </g>
  <rect y="530" width="800" height="70" fill="#d5cfc2"/>
  <path d="M0 530h800" stroke="#bfb8a7" stroke-width="3"/>
</svg>
